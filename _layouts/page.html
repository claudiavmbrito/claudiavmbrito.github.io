---
layout: default
---
<article>
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.toc %}
    <nav aria-label="Sections">
      <ul class="toc">
        {%- for sec in page.toc %}<li><a href="#{{ sec.id }}">{{ sec.title }}</a></li>{% endfor -%}
      </ul>
    </nav>
    {%- endif %}
  </header>
  <div class="prose{% if page.wide %} wide{% endif %}">
{{ content }}
  </div>
</article>
