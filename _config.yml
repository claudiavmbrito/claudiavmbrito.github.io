# Site configuration. Jekyll does not reload this file while `jekyll serve` runs;
# restart the server after editing it.

# Site
locale                   : "en-US"
title                    : "Cláudia Brito"
title_separator          : "-"
name                     : "Cláudia Brito"
description              : "Cláudia Brito — Assistant Researcher in AI for Systems and Systems for AI at INESC TEC / HASLab and Invited Assistant Professor at the University of Minho."
url                      : https://claudiavmbrito.github.io
baseurl                  : ""
repository               : "claudiavmbrito/claudiavmbrito.github.io"
future                   : true
timezone                 : Europe/Lisbon

# SEO (used by _includes/seo.html)
og_image                 : "cvmbrito.jpg" # filename in /images/
social:
  type                   : "Person"
  name                   : "Cláudia Brito"
  links:
    - "https://scholar.google.com/citations?user=ertclDsAAAAJ&hl"
    - "https://orcid.org/0000-0003-4293-9887"
    - "https://www.linkedin.com/in/claudiavmbrito/"
    - "https://github.com/claudiavmbrito"

# Analytics
analytics:
  provider               : "google-gtag"
  google:
    tracking_id          : "G-40FQYBVD5B"

# Author (profile links themselves live in _data/social.yml)
author:
  name                   : "Cláudia Brito"
  email                  : "claudia.v.brito@inesctec.pt"
  googlescholar          : "https://scholar.google.com/citations?user=ertclDsAAAAJ&hl"
  orcid                  : "https://orcid.org/0000-0003-4293-9887"
  github                 : "claudiavmbrito"
  linkedin               : "claudiavmbrito"

# Reading files
include:
  - _pages
  - files
exclude:
  - .bundle
  - .claude
  - .impeccable
  - .jekyll-cache
  - .sass-cache
  - CLAUDE.md
  - DESIGN.md
  - PRODUCT.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Collections: conference posters, shown on the Talks page
collections:
  tryouts:
    output: true
    permalink: /tryouts/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: tryouts
    values:
      layout: page

# Plugins (all on the GitHub Pages whitelist)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
